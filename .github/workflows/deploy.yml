name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build (offline, from committed data)
        run: python scripts/build_site.py
      - name: No full names in the repo or in the build
        run: python scripts/check_names.py
      - name: No external resources in the build
        run: |
          if grep -rEl 'src="https?://|href="https?://[^"]*\.(css|js)' build/ ; then
            echo "external resource found"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
